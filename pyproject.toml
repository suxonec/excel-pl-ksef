[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksefiz"
version = "0.2.0"
description = "Bulk KSeF 2.0 collective identifier (IZ) helper: detect, validate, decode, generate, lookup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "cryptography>=42",
    "openpyxl>=3.1",
    "keyring>=25",
    "lxml>=5",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
    "types-openpyxl",
    "oletools>=0.60",
]
packaging = [
    "pyinstaller>=6.6",
]

[project.scripts]
ksefiz = "ksefiz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ksefiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Also works when macOS flags the venv's .pth files hidden (Python 3.12+ skips those)
pythonpath = ["src"]
markers = ["e2e: calls the KSeF TEST environment; needs credentials"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff.lint.per-file-ignores]
# FA(3) XML template lines
"scripts/send_test_invoices.py" = ["E501"]
